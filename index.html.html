<style>
:root{
  --paper:#F7F3EC; --surface:#FFFFFF; --sunk:#EFE8DC; --line:#E1D7C7;
  --ink:#14263B; --muted:#5E6573; --faint:#958D81;
  --accent:#00589A; --accent-ink:#FFFFFF; --accent-soft:#DCE9F5;
  --sky:#C98217; --sky-soft:#FBF0DC; --wood:#8A5A3C;
  --ok:#17803D; --ok-soft:#DDF3E4; --warn:#A45A06; --warn-soft:#FBEBD3;
  --bad:#B42323; --bad-soft:#F9DEDE; --info:#5B4DB0; --info-soft:#E7E4F7;
  --shadow:0 1px 2px rgba(22,37,47,.06),0 4px 14px rgba(22,37,47,.05);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#10151C; --surface:#18202A; --sunk:#202A36; --line:#2E3A48;
  --ink:#E8EDF3; --muted:#A3AEBB; --faint:#7A8593;
  --accent:#5AA7E6; --accent-ink:#08131F; --accent-soft:#16304A;
  --sky:#F0B04A; --sky-soft:#33280F; --wood:#C9936B;
  --ok:#5CCB84; --ok-soft:#17311F; --warn:#E6A24C; --warn-soft:#382711;
  --bad:#F07C7C; --bad-soft:#3A1A1A; --info:#A89BF0; --info-soft:#262143;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10151C; --surface:#18202A; --sunk:#202A36; --line:#2E3A48;
  --ink:#E8EDF3; --muted:#A3AEBB; --faint:#7A8593;
  --accent:#5AA7E6; --accent-ink:#08131F; --accent-soft:#16304A;
  --sky:#F0B04A; --sky-soft:#33280F; --wood:#C9936B;
  --ok:#5CCB84; --ok-soft:#17311F; --warn:#E6A24C; --warn-soft:#382711;
  --bad:#F07C7C; --bad-soft:#3A1A1A; --info:#A89BF0; --info-soft:#262143;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.seal{width:40px;height:40px;border-radius:10px;background:#fff;padding:2px;flex:none;object-fit:contain;border:1px solid var(--line)}

.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,32,58,.88) 0%,rgba(10,32,58,.62) 45%,rgba(10,32,58,.05) 100%)}
[dir="rtl"] .hero::before{background:linear-gradient(270deg,rgba(10,32,58,.88) 0%,rgba(10,32,58,.62) 45%,rgba(10,32,58,.05) 100%)}
.hero .wrap{position:relative;display:flex;align-items:center;gap:18px;padding-block:30px;min-height:170px}
.hero-logo{width:92px;height:92px;flex:none;background:#fff;border-radius:22px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hero h2{margin:0;font:700 26px/1.25 var(--f-disp);text-wrap:balance}
.hero .en{font:500 15px var(--f-disp);opacity:.9;letter-spacing:.01em}
.hero .dept{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;background:var(--sky);color:#1a1204;border-radius:6px;padding:2px 9px}
.brand b{display:block;font:600 16px/1.2 var(--f-disp);text-wrap:balance}
.brand small{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}

/* controls */
.controls{display:grid;gap:12px;padding-block:18px 8px}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.field{display:grid;gap:4px}
.field>span,.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
input[type=date],select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;min-width:44px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip small{font-weight:400;opacity:.7;margin-inline-start:4px;font-size:11px}
.dayname{font:600 15px var(--f-disp);color:var(--accent);padding-bottom:6px}

/* heading + progress */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:14px 12px}
.head h1{font:600 24px/1.2 var(--f-disp);margin:0;text-wrap:balance}
.head .meta{color:var(--muted);font-size:13.5px}
.bar{flex:1 1 180px;max-width:320px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.note{background:var(--sky-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}

/* timeline */
.timeline{display:grid;gap:10px;padding-bottom:40px}
.slot{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:stretch}
.time{display:flex;flex-direction:column;align-items:center;justify-content:center;border-inline-end:2px solid var(--line);padding-inline-end:10px;color:var(--muted);font-size:12.5px;line-height:1.3}
.time b{font:700 20px var(--f-disp);color:var(--ink)}
.slot.is-now .time{border-color:var(--sky)} .slot.is-now .time b{color:var(--sky)}
.pause{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:10px;background:var(--sunk);color:var(--muted);font-weight:500}
.pause .t{margin-inline-start:auto;font-size:12.5px;white-space:nowrap}
.slot.slim .time b{font-size:13px;font-weight:600;color:var(--muted)}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.slot.is-now .lesson{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.l-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.subj{font:600 17px/1.3 var(--f-disp)}
.cls{font:700 15px var(--f-disp);background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 8px}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted);font-weight:500}
.tag.room{color:var(--wood)}
.tag.now{background:var(--sky);color:#1a1204}
.teacher{color:var(--muted);font-size:14px}
.teacher b{color:var(--ink);font-weight:500}
.l-bot{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-none{background:var(--sunk);color:var(--muted)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-late,.s-low{background:var(--warn-soft);color:var(--warn)}
.s-absent,.s-nolink{background:var(--bad-soft);color:var(--bad)}
.s-tech{background:var(--info-soft);color:var(--info)}
.when{font-size:12px;color:var(--faint)}
.acts{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn:hover{filter:brightness(.97)}

/* record form */
.form{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500}
.opts input:checked+span{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.opts input:focus-visible+span{outline:2px solid var(--sky)}
.f2{display:grid;grid-template-columns:1fr 220px;gap:10px}
textarea{min-height:60px;resize:vertical;width:100%}
.hist{font-size:12.5px;color:var(--muted);display:grid;gap:3px;margin:0;padding:0;list-style:none}
.err{color:var(--bad);font-size:13px}

/* now grid */
.mine{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px 16px;margin-top:16px;display:grid;gap:10px}
.mine-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.mine-top b{font:600 16px var(--f-disp)}
.mine select{min-width:120px}
.mine-now{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.mine-now .what{display:grid;gap:2px;min-width:0}
.mine-now .what small{color:var(--muted);font-size:12.5px}
.mine-now .what strong{font:600 19px/1.3 var(--f-disp)}
.btn.big{font-size:16px;padding:10px 20px;margin-inline-start:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding-bottom:40px}

/* report */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:grid;min-width:110px}
.tile b{font:600 22px var(--f-disp)} .tile span{font-size:12.5px;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .tile.main span{color:inherit;opacity:.85}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:40px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.print-head{display:none}
.login{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-top:16px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end}
.login>div:first-child{flex:1 1 100%} .login p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.login .err{flex-basis:100%}
.login .err:empty{display:none}

@media (max-width:640px){
  .slot{grid-template-columns:58px 1fr;gap:8px}
  .time b{font-size:17px}
  .f2{grid-template-columns:1fr}
  .head h1{font-size:20px}
  .tabs{order:3;width:100%} .tabs button{flex:1}
  .hero .wrap{min-height:130px;padding-block:20px;gap:12px} .hero-logo{width:64px;height:64px;border-radius:16px} .hero h2{font-size:20px} .hero .en{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff;color:#000;font-size:11.5px}
  .top,.hero,.controls,.noprint{display:none!important}
  .print-head img{width:48px;height:48px;float:inline-start;margin-inline-end:10px}
  .print-head{display:block;margin-bottom:10px}
  .print-head h2{margin:0;font:600 17px var(--f-disp)}
  .tablebox{border:1px solid #999;overflow:visible}
  th{background:#eee;color:#000} th,td{border-bottom:1px solid #bbb;padding:4px 6px}
  .tile{border:1px solid #999} .tile.main{background:#fff;color:#000}
  .pill{padding:0;background:none!important}
  @page{size:A4 landscape;margin:12mm}
}
</style>

async function sha256(txt){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function verifyPin(pin){
  if(CONFIG.SHEETS_URL){ const j=await api({action:"verify",pin}); return !!j.ok; }
  return (await sha256(pin))===CONFIG.PIN_HASH;
}

    <div class="l-top">${showClass?`<span class="cls">${c}</span>`:""}<span class="subj">${esc(subj(s))}</span>
      ${span>1?`<span class="tag">${t.double}</span>`:""}${room?`<span class="tag room">${esc(room)}</span>`:""}
      ${showClass?`<span class="tag">${range(pt[1],pt[2])}</span>`:""}${isNow?`<span class="tag now">${t.now}</span>`:""}</div>
    <div class="teacher"><b>${esc(teacherName(teacher))}</b></div>
    <div class="l-bot">${state.sup?pill:""}<div class="acts">
      ${link?`<a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">${t.join} ↗</a>`:`<span class="btn" aria-disabled="true">${t.noLink}</span>`}
      ${state.sup?`<button class="btn" data-act="toggle" data-key="${key}">${open?t.cancel:(last?t.edit:t.record)}</button>`:""}</div></div>`;
  if(open){
    const hist=checksFor(c,p);
    html+=`<form class="form" data-key="${key}" data-subj="${esc(s)}" data-teacher="${esc(teacher)}">
      <div class="lbl">${t.result}</div>
      <div class="opts">${STATUSES.map(st=>`<label class="s-${st}" style="background:none"><input type="radio" name="st" value="${st}"><span>${t.st[st]}</span></label>`).join("")}</div>
      <div class="f2"><label class="field"><span>${t.notes}</span><textarea name="note" id="n-${key}" placeholder="${t.notesPh}"></textarea></label>
      <label class="field"><span>${t.observer}</span><input type="text" name="observer" id="o-${key}" value="${esc(state.observer)}" placeholder="${t.observerPh}"></label></div>
      <div class="row"><button class="btn primary" type="submit">${t.save}</button><span class="err" role="alert"></span></div>
      ${hist.length?`<ul class="hist"><li><b>${t.earlier}</b></li>${hist.slice().reverse().map(r=>`<li>${clock(r.at)} · ${t.st[r.status]} · ${esc(r.observer)}${r.note?" — "+esc(r.note):""}</li>`).join("")}</ul>`:""}
    </form>`;
  }
  return html+"</article>";
}

function currentPeriod(g){
  const n=riyadhNow(); if(n.date!==state.date) return null;
  const s=slotsFor(g).find(s=>n.time>=s[1]&&n.time<s[2]); return s?s[0]:null;
}

function viewTimetable(){
  const t=T(), dk=dayKey(state.date), g=state.grade, cls=classesOf(g);
  if(!cls.includes(state.cls)) state.cls=cls[0];
  let h=`<section class="controls"><div class="row">${dateField()}${gradeChips("grade",g)}</div>
    <div class="field"><span class="lbl">${t.cls}</span><div class="seg" data-group="cls">${cls.map(c=>`<button class="chip" data-val="${c}" aria-pressed="${c===state.cls}">${c}${TT[c].track?`<small>${TT[c].track}</small>`:""}</button>`).join("")}</div></div></section>`;
  if(!dk) return h+`<p class="note">${t.weekend}</p>`;
  const done=[1,2,3,4,5,6,7,8].filter(p=>latest(state.cls,p)).length, cur=currentPeriod(g);
  h+=`<div class="head"><h1>${state.cls} · ${t.days[dk]}</h1>${state.sup?`<span class="meta">${t.checked(done,8)}</span><div class="bar"><b style="width:${done/8*100}%"></b></div>`:""}</div><div class="timeline">`;
  for(const [p,a,b] of slotsFor(g)){
    const now=cur===p;
    if(typeof p!=="number"){ h+=`<div class="slot slim ${now?"is-now":""}"><div class="time"><b>${fmt12(a)}</b></div><div class="pause">${t[p]}<span class="t">${range(a,b)}</span></div></div>`; continue; }
    h+=`<div class="slot ${now?"is-now":""}"><div class="time"><b>${p}</b><span>${fmt12(a)}</span><span>${fmt12(b)}</span></div>${lessonCard(state.cls,p,g,{isNow:now})}</div>`;
  }
  return h+"</div>";
}

function studentPanel(){
  const t=T(), all=Object.keys(TT);
  const opts=`<option value="">${t.pick}</option>`+["7","8","9"].map(g=>`<optgroup label="${t.gradeN} ${g}">${classesOf(g).map(c=>`<option value="${c}" ${c===state.myClass?"selected":""}>${c}</option>`).join("")}</optgroup>`).join("");
  let h=`<section class="mine"><div class="mine-top"><b>${t.myClass}</b><select id="f-myclass" aria-label="${t.pick}">${opts}</select></div>`;
  const c=state.myClass;
  if(!c || !TT[c]) return h+"</section>";
  const n=riyadhNow(), dk=dayKey(n.date), g=gradeOf(c);
  if(!dk) return h+`<div class="mine-now"><span>${t.noSchool}</span></div></section>`;
  const slots=slotsFor(g);
  let cur=slots.find(s=>n.time>=s[1]&&n.time<s[2]), label=t.nowLesson, p=null;
  if(cur && typeof cur[0]==="number") p=cur[0];
  else { const nx=slots.find(s=>typeof s[0]==="number" && s[1]>n.time); if(nx){ p=nx[0]; label=(cur&&cur[0]==="break")?`${t.inBreak} · ${t.nextLesson}`:t.nextLesson; } }
  if(p==null) return h+`<div class="mine-now"><span>${t.noMore}</span></div></section>`;
  const L=TT[c].days[dk][p-1], pt=periodTime(g,p);
  if(!L) return h+"</section>";
  const link=linkFor(L[1]);
  return h+`<div class="mine-now"><div class="what"><small>${label} · ${t.period} ${p} · ${range(pt[1],pt[2])}</small><strong>${esc(subj(L[0]))}</strong><span>${esc(teacherName(L[1]))}</span></div>
    ${link?`<a class="btn primary big" href="${esc(link)}" target="_blank" rel="noopener">${t.joinNow} ↗</a>`:`<span class="btn big" aria-disabled="true">${t.noLink}</span>`}</div></section>`;
}

function viewNow(){
  const t=T(), dk=dayKey(state.date);
  const gs = state.nowGrade==="all"?["7","8","9"]:[state.nowGrade];
  if(state.period==null){ state.period = currentPeriod(gs[0]); if(typeof state.period!=="number") state.period=1; }
  let h=`<section class="controls"><div class="row">${dateField()}${gradeChips("nowGrade",state.nowGrade,true)}
    <div class="field"><span class="lbl">${t.period}</span><div class="seg" data-group="period">${[1,2,3,4,5,6,7,8].map(p=>`<button class="chip" data-val="${p}" aria-pressed="${p===state.period}">${p}</button>`).join("")}</div></div></div></section>`;
  h = studentPanel() + h;
  if(!dk) return h+`<p class="note">${t.weekend}</p>`;
  const p=state.period, cls=gs.flatMap(classesOf);
  const done=cls.filter(c=>latest(c,p)).length;
  h+=`<div class="head"><h1>${t.nowTitle(p,t.days[dk])}</h1>${state.sup?`<span class="meta">${t.checked(done,cls.length)}</span><div class="bar"><b style="width:${done/cls.length*100}%"></b></div>`:""}</div>
    <p class="note">${t.nowHint}</p><div class="grid">`;
  for(const c of cls){ const g=gradeOf(c); h+=lessonCard(c,p,g,{showClass:true,isNow:currentPeriod(g)===p}); }
  return h+"</div>";
}

function reportRows(){
  const dk=dayKey(state.date); if(!dk) return [];
  const gs = state.repGrade==="all"?["7","8","9"]:[state.repGrade];
  const rows=[];
  for(const c of gs.flatMap(classesOf)) for(let p=1;p<=8;p++){
    const r=latest(c,p); if(!r) continue;
    const L=TT[c].days[dk][p-1]||["","","",1], pt=periodTime(gradeOf(c),p);
    rows.push({c,p,time:rangeTxt(pt[1],pt[2]),subject:L[0],teacher:L[1],r});
  }
  return rows;
}

function loginPanel(){
  if(!state.login || state.sup) return "";
  const t=T();
  return `<form class="login" id="loginForm"><div><b>${t.supTitle}</b><p>${t.supHint}</p></div>
    <label class="field"><span>${t.observer}</span><input type="text" id="l-name" value="${esc(state.observer)}" placeholder="${t.observerPh}" autocomplete="name"></label>
    <label class="field"><span>${t.pin}</span><input type="password" id="l-pin" inputmode="numeric" autocomplete="off"></label>
    <div class="row"><button class="btn primary" type="submit">${t.enter}</button><button class="btn" type="button" data-act="closeLogin">${t.cancel}</button></div>
    <span class="err" role="alert">${esc(state.loginErr)}</span></form>`;
}
function render(){
  renderStatic();
  if(state.view!=="now" && !state.sup) state.view="now";
  $("#app").innerHTML = loginPanel() + (state.view==="now"?viewNow():state.view==="report"?viewReport():viewTimetable());
}

function downloadCSV(){
  const t=T(), rows=reportRows();
  const lines=[t.th].concat(rows.map(x=>[x.c,x.p,x.time,subj(x.subject),teacherName(x.teacher),t.st[x.r.status],x.r.note||"",x.r.observer,clock(x.r.at)]));
  const csv="﻿"+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`monitoring-report-${state.date}${state.repGrade==="all"?"":"-G"+state.repGrade}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tabs button");
  if(tab){ state.view=tab.dataset.view; store.set("rlm.view",state.view); state.open=null; render(); return; }
  if(e.target.closest("#supBtn")){ if(state.sup) logout(); else { state.login=!state.login; state.loginErr=""; render(); if(state.login) $("#l-name").focus(); } return; }
  if(e.target.closest("#langBtn")){ state.lang=state.lang==="ar"?"en":"ar"; store.set("rlm.lang",state.lang); render(); return; }
  const chip=e.target.closest(".seg .chip");
  if(chip){
    const grp=chip.parentElement.dataset.group, v=chip.dataset.val;
    if(grp==="grade"){ state.grade=v; state.cls=classesOf(v)[0]; store.set("rlm.grade",v); }
    if(grp==="cls"){ state.cls=v; }
    if(grp==="nowGrade"){ state.nowGrade=v; store.set("rlm.nowGrade",v); }
    if(grp==="period"){ state.period=Number(v); }
    if(grp==="repGrade"){ state.repGrade=v; }
    store.set("rlm.cls",state.cls); state.open=null; render(); return;
  }
  const act=e.target.closest("[data-act]");
  if(!act) return;
  if(act.dataset.act==="toggle"){ state.open = state.open===act.dataset.key?null:act.dataset.key; render();
    const f=document.querySelector(`form[data-key="${state.open}"]`); if(f) f.querySelector("input[name=st]").focus(); }
  if(act.dataset.act==="closeLogin"){ state.login=false; render(); }
  if(act.dataset.act==="print") window.print();
  if(act.dataset.act==="csv") downloadCSV();
});
document.addEventListener("change",async e=>{
  if(e.target.id==="f-myclass"){ state.myClass=e.target.value; store.set("rlm.myClass",state.myClass); render(); return; }
  if(e.target.id==="f-date" && e.target.value){ state.date=e.target.value; state.open=null; state.period=null; await loadRecords(); render(); }
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="loginForm"){
    e.preventDefault(); const t=T(), name=$("#l-name").value.trim(), pin=$("#l-pin").value.trim();
    state.observer=name;
    if(!name){ state.loginErr=t.needName; render(); return; }
    let ok=false; try{ ok=await verifyPin(pin); }catch(err){ state.loginErr=t.netErr; render(); return; }
    if(!ok){ state.loginErr=t.badPin; render(); $("#l-pin").focus(); return; }
    state.sup={name,pin}; store.set("rlm.sup",state.sup); state.observer=name; store.set("rlm.observer",name);
    state.login=false; state.loginErr=""; await loadRecords(); render(); return;
  }
  const f=e.target.closest("form.form"); if(!f) return; e.preventDefault();
  const t=T(), st=f.querySelector("input[name=st]:checked"), obs=f.observer.value.trim(), err=f.querySelector(".err");
  if(!st){ err.textContent=t.pickStatus; return; }
  if(!obs){ err.textContent=t.needName; f.observer.focus(); return; }
  const [cls,period]=f.dataset.key.split("|");
  state.observer=obs; store.set("rlm.observer",obs);
  f.querySelector("button[type=submit]").disabled=true;
  await addRecord({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:state.date,cls,period:Number(period),status:st.value,note:f.note.value.trim(),observer:obs,at:new Date().toISOString(),subject:f.dataset.subj,teacher:f.dataset.teacher});
  state.open=null; render();
});

render();
loadRecords().then(render);
loadLinks();
if(CONFIG.SHEETS_URL) setInterval(loadLinks,5*60000);
if(CONFIG.SHEETS_URL) setInterval(()=>{ if(!state.open && state.sup && !state.login) loadRecords().then(render);
loadLinks();
if(CONFIG.SHEETS_URL) setInterval(loadLinks,5*60000); },60000);
setInterval(()=>{ if(!state.open && !state.login && state.view!=="report") render(); },60000);
</script>
